[project]
name = "readingroom"
version = "0.1.0"
description = "A research assistant that may only consult the documents on its own shelf."
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.24",
    "mcp>=2.2,<3",   # 2.x renamed FastMCP to MCPServer; code written against 2.2
    "openai>=3.0",   # talks to OpenRouter, which speaks the same protocol
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/readingroom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
